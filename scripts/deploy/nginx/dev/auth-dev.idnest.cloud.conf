# Trusted OAuth orchestration + Angular authentication UI.
server {
    listen 80;
    server_name auth-dev.idnest.cloud;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name auth-dev.idnest.cloud;

    ssl_certificate     /etc/nginx/ssl/idnest-cloud/idnest-cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/idnest-cloud/idnest-cloudflare-origin-key.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://kratos-dev.idnest.cloud; img-src 'self' data: https://assets.idnest.cloud; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://kratos-dev.idnest.cloud" always;

    # Browser-safe context and decision endpoints exposed by auth-backend.
    location ^~ /auth/v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
    }

    location = /auth {
        return 301 /auth/;
    }

    location = /auth/index.html {
        alias /var/www/auth-frontend/browser/index.html;
        expires -1;
    }

    # Angular authentication UI and client-side route fallback.
    location ^~ /auth/ {
        alias /var/www/auth-frontend/browser/;
        try_files $uri $uri/ /auth/index.html;
    }

    # Keep the backend health endpoint available to infrastructure.
    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # OAuth login/consent/logout callbacks and server-rendered fallback pages.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
    }
}
