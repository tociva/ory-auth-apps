# Public Kratos self-service/session endpoints. The admin port remains loopback-only.
server {
    listen 80;
    server_name kratos-dev.idnest.cloud;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kratos-dev.idnest.cloud;

    ssl_certificate     /etc/nginx/ssl/idnest-cloud/idnest-cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/idnest-cloud/idnest-cloudflare-origin-key.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://127.0.0.1:4433;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_read_timeout 60s;
    }
}
